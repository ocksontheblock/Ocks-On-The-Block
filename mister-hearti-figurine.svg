  <rect x="175" y="510" width="10" height="2" rx="1" fill="#FFFFFF"/>
  <rect x="215" y="510" width="10" height="2" rx="1" fill="#FFFFFF"/>
  
  <!-- Dark jeans -->
  <ellipse cx="200" cy="460" rx="45" ry="35" fill="#2E3A52"/>
  <rect x="160" y="425" width="80" height="70" rx="15" fill="#2E3A52"/>
