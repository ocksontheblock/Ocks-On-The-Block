<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- AMPED OCK FIGURINE - COPYRIGHT SAFE DESIGN -->
  <!-- Professional figurine base -->
  <rect x="40" y="540" width="320" height="50" rx="8" fill="#2C3E50"/>
  <rect x="45" y="545" width="310" height="40" rx="6" fill="#34495E"/>
  
  <!-- Professional graffiti logo on base -->
  <!-- Shadow layer -->
  <text x="202" y="572" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="900" fill="#000000" opacity="0.6">
    OCKS ON THE BLOCK
  </text>
  <!-- Main logo -->
  <text x="200" y="570" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="900" fill="#FF4500" stroke="#FFFFFF" stroke-width="0.8">
    OCKS ON THE BLOCK
  </text>
  <!-- Highlight -->
  <text x="198" y="568" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="900" fill="#FFD700" opacity="0.9">
    OCKS ON THE BLOCK
  </text>
  
  <!-- Character legs -->
  <ellipse cx="170" cy="500" rx="14" ry="35" fill="#D4A574"/>
  <ellipse cx="230" cy="500" rx="14" ry="35" fill="#D4A574"/>
  
  <!-- Plain sneakers - NO BRAND LOGOS -->
  <ellipse cx="170" cy="530" rx="22" ry="14" fill="#1A1A1A"/>
  <ellipse cx="230" cy="530" rx="22" ry="14" fill="#1A1A1A"/>
  <!-- Shoe details -->
  <ellipse cx="170" cy="528" rx="18" ry="10" fill="#2C2C2C"/>
  <ellipse cx="230" cy="528" rx="18" ry="10" fill="#2C2C2C"/>
  <!-- White laces -->
  <path d="M158,525 Q170,520 182,525" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <path d="M218,525 Q230,520 242,525" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <!-- Sole lines -->
  <ellipse cx="170" cy="535" rx="20" ry="6" fill="#3A3A3A"/>
  <ellipse cx="230" cy="535" rx="20" ry="6" fill="#3A3A3A"/>
  
  <!-- Khaki shorts -->
  <rect x="150" y="450" width="100" height="60" rx="10" fill="#A0936B"/>
  <rect x="240" y="465" width="12" height="25" rx="3" fill="#8B7F5C"/>
  
  <!-- Torso -->
  <ellipse cx="200" cy="400" rx="50" ry="40" fill="#D4A574"/>
  
  <!-- Plain hoodie - NO BRAND LOGOS -->
  <ellipse cx="200" cy="400" rx="55" ry="45" fill="#95A5A6"/>
  <!-- Hood -->
  <path d="M155,370 Q200,350 245,370 Q240,385 200,390 Q160,385 155,370" fill="#7F8C8D"/>
  <!-- Drawstrings -->
  <circle cx="182" cy="385" r="3" fill="#34495E"/>
  <circle cx="218" cy="385" r="3" fill="#34495E"/>
  <!-- Kangaroo pocket -->
  <ellipse cx="200" cy="425" rx="28" ry="12" fill="#7F8C8D"/>
  
  <!-- Arms -->
  <ellipse cx="140" cy="390" rx="20" ry="35" fill="#D4A574"/>
  <ellipse cx="260" cy="390" rx="20" ry="35" fill="#D4A574"/>
  <!-- Hoodie sleeves -->
  <ellipse cx="140" cy="385" rx="22" ry="30" fill="#95A5A6"/>
  <ellipse cx="260" cy="385" rx="22" ry="30" fill="#95A5A6"/>
  
  <!-- Hands -->
  <circle cx="122" cy="420" r="14" fill="#D4A574"/>
  <circle cx="278" cy="420" r="14" fill="#D4A574"/>
  
  <!-- NYC bodega coffee cup in hand -->
  <rect x="105" y="400" width="18" height="24" rx="3" fill="#F39C12"/>
  <!-- "We Are Happy To Serve You" pattern -->
  <rect x="108" y="405" width="12" height="3" fill="#3498DB"/>
  <rect x="108" y="410" width="12" height="2" fill="#E74C3C"/>
  <rect x="108" y="414" width="12" height="2" fill="#2ECC71"/>
  <!-- Steam -->
  <path d="M114,398 Q116,392 114,388" stroke="#ECF0F1" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M118,398 Q116,392 118,388" stroke="#ECF0F1" stroke-width="1.5" fill="none" opacity="0.7"/>
  
  <!-- Head -->
  <circle cx="200" cy="320" r="40" fill="#D4A574"/>
  
  <!-- Facial hair (mustache and goatee) -->
  <path d="M180,340 Q200,350 220,340 Q215,345 200,347 Q185,345 180,340" fill="#8B4513"/>
  
  <!-- Eyes -->
  <ellipse cx="185" cy="315" rx="10" ry="12" fill="white"/>
  <ellipse cx="215" cy="315" rx="10" ry="12" fill="white"/>
  <circle cx="185" cy="315" r="6" fill="#2C3E50"/>
  <circle cx="215" cy="315" r="6" fill="#2C3E50"/>
  <!-- Pupils -->
  <circle cx="185" cy="315" r="3" fill="#000"/>
  <circle cx="215" cy="315" r="3" fill="#000"/>
  
  <!-- Eyebrows -->
  <path d="M175,305 Q185,300 195,305" stroke="#654321" stroke-width="4" fill="none"/>
  <path d="M205,305 Q215,300 225,305" stroke="#654321" stroke-width="4" fill="none"/>
  
  <!-- Nose -->
  <ellipse cx="200" cy="325" rx="4" ry="6" fill="#C19A6B"/>
  
  <!-- Mouth (friendly smile) -->
  <path d="M185,335 Q200,345 215,335" stroke="#8B4513" stroke-width="3" fill="none"/>
  
  <!-- Ears -->
  <ellipse cx="160" cy="320" rx="10" ry="14" fill="#D4A574"/>
  <ellipse cx="240" cy="320" rx="10" ry="14" fill="#D4A574"/>
  
  <!-- Plain baseball cap - NO BRAND LOGOS -->
  <ellipse cx="200" cy="295" rx="45" ry="18" fill="#2C3E50"/>
  <path d="M155,295 Q200,275 245,295 Q240,285 200,283 Q160,285 155,295" fill="#34495E"/>
  <!-- Cap brim -->
  <ellipse cx="200" cy="302" rx="50" ry="10" fill="#1B2631"/>
  <!-- Simple cap design - solid colors only -->
  <ellipse cx="200" cy="290" rx="30" ry="12" fill="#34495E"/>
  
  <!-- Hair showing under cap -->
  <path d="M165,285 Q175,280 185,285" stroke="#654321" stroke-width="5" fill="none"/>
  <path d="M215,285 Q225,280 235,285" stroke="#654321" stroke-width="5" fill="none"/>
</svg>