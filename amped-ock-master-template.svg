<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- AMPED OCK - MASTER TEMPLATE STYLE -->
  <!-- Professional rectangular base matching your template -->
  <rect x="60" y="530" width="280" height="60" rx="4" fill="#8B8680" stroke="#6B625C" stroke-width="2"/>
  <!-- Base edge detail -->
  <rect x="65" y="535" width="270" height="6" rx="2" fill="#9B9590"/>
  
  <!-- "OCKS ON THE" engraved text (top line) -->
  <text x="200" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5A5550">
    OCKS ON THE
  </text>
  <!-- "BLOCK" engraved text (bottom line) -->
  <text x="200" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5A5550">
    BLOCK
  </text>
  
  <!-- Character stance - hands in hoodie pocket, relaxed pose -->
  
  <!-- Legs with relaxed stance -->
  <ellipse cx="180" cy="480" rx="16" ry="40" fill="#D4A574"/>
  <ellipse cx="220" cy="485" rx="16" ry="38" fill="#D4A574"/>
  
  <!-- Clean sneakers - chunky style like template, NO brand logos -->
  <ellipse cx="180" cy="520" rx="24" ry="16" fill="#4A4A4A"/>
  <ellipse cx="220" cy="520" rx="24" ry="16" fill="#4A4A4A"/>
  <!-- Sneaker soles -->
  <ellipse cx="180" cy="525" rx="26" ry="8" fill="#3A3A3A"/>
  <ellipse cx="220" cy="525" rx="26" ry="8" fill="#3A3A3A"/>
  <!-- Shoe details -->
  <ellipse cx="180" cy="516" rx="20" ry="12" fill="#5A5A5A"/>
  <ellipse cx="220" cy="516" rx="20" ry="12" fill="#5A5A5A"/>
  <!-- Laces -->
  <rect x="175" y="510" width="10" height="2" rx="1" fill="#FFFFFF"/>
  <rect x="215" y="510" width="10" height="2" rx="1" fill="#FFFFFF"/>
  
  <!-- Sweatpants/joggers -->
  <ellipse cx="200" cy="460" rx="45" ry="35" fill="#6B6B6B"/>
  <rect x="160" y="425" width="80" height="70" rx="15" fill="#6B6B6B"/>
  <!-- Pant cuffs -->
  <rect x="165" y="485" width="15" height="8" rx="4" fill="#5A5A5A"/>
  <rect x="220" y="490" width="15" height="8" rx="4" fill="#5A5A5A"/>
  
  <!-- Torso -->
  <ellipse cx="200" cy="380" rx="50" ry="45" fill="#D4A574"/>
  
  <!-- Hoodie - clean, no brand logos -->
  <ellipse cx="200" cy="380" rx="55" ry="50" fill="#7D8471"/>
  <!-- Hood up style -->
  <path d="M150,340 Q200,315 250,340 Q245,360 200,365 Q155,360 150,340" fill="#6B7160"/>
  <!-- Hood shadow -->
  <path d="M160,345 Q200,325 240,345 Q235,355 200,358 Q165,355 160,345" fill="#5F6B58"/>
  
  <!-- Arms - hands in hoodie pocket pose -->
  <ellipse cx="150" cy="390" rx="20" ry="35" fill="#D4A574" transform="rotate(-15 150 390)"/>
  <ellipse cx="250" cy="390" rx="20" ry="35" fill="#D4A574" transform="rotate(15 250 390)"/>
  <!-- Hoodie sleeves -->
  <ellipse cx="150" cy="385" rx="22" ry="30" fill="#7D8471" transform="rotate(-15 150 385)"/>
  <ellipse cx="250" cy="385" rx="22" ry="30" fill="#7D8471" transform="rotate(15 250 385)"/>
  
  <!-- Hands hidden in hoodie pocket -->
  <ellipse cx="200" cy="410" rx="35" ry="15" fill="#6B7160"/>
  
  <!-- Coffee cup in pocket area -->
  <rect x="230" y="395" width="12" height="18" rx="2" fill="#F39C12"/>
  <rect x="232" y="398" width="8" height="3" fill="#3498DB"/>
  <rect x="232" y="403" width="8" height="2" fill="#E74C3C"/>
  
  <!-- Head with hood partially covering -->
  <circle cx="200" cy="340" r="38" fill="#D4A574"/>
  
  <!-- Hood covering top of head -->
  <path d="M170,320 Q200,308 230,320 Q225,335 200,338 Q175,335 170,320" fill="#6B7160" opacity="0.9"/>
  
  <!-- Face - relaxed, friendly expression -->
  <!-- Eyes with slight droop/chill look -->
  <ellipse cx="188" cy="335" rx="8" ry="10" fill="white"/>
  <ellipse cx="212" cy="335" rx="8" ry="10" fill="white"/>
  <ellipse cx="188" cy="337" rx="5" ry="6" fill="#2C3E50"/>
  <ellipse cx="212" cy="337" rx="5" ry="6" fill="#2C3E50"/>
  <!-- Pupils -->
  <circle cx="188" cy="337" r="2" fill="#000"/>
  <circle cx="212" cy="337" r="2" fill="#000"/>
  
  <!-- Eyebrows - relaxed -->
  <path d="M180,325 Q188,322 196,325" stroke="#654321" stroke-width="3" fill="none"/>
  <path d="M204,325 Q212,322 220,325" stroke="#654321" stroke-width="3" fill="none"/>
  
  <!-- Nose -->
  <ellipse cx="200" cy="345" rx="4" ry="6" fill="#C19A6B"/>
  
  <!-- Facial hair - goatee and mustache -->
  <path d="M185,355 Q200,365 215,355 Q210,360 200,362 Q190,360 185,355" fill="#654321"/>
  <ellipse cx="200" cy="350" rx="8" ry="3" fill="#654321"/>
  
  <!-- Mouth - slight smile, chill expression -->
  <path d="M190,355 Q200,360 210,355" stroke="#8B4513" stroke-width="2" fill="none"/>
  
  <!-- Ears partially covered by hood -->
  <ellipse cx="168" cy="340" rx="8" ry="12" fill="#D4A574"/>
  <ellipse cx="232" cy="340" rx="8" ry="12" fill="#D4A574"/>
  
  <!-- Hair showing from under hood - messy style -->
  <path d="M175,325 Q185,320 190,325" stroke="#654321" stroke-width="4" fill="none"/>
  <path d="M210,325 Q220,320 225,325" stroke="#654321" stroke-width="4" fill="none"/>
  <path d="M190,315 Q200,312 210,315" stroke="#654321" stroke-width="3" fill="none"/>
  
  <!-- Hoodie details -->
  <!-- Drawstring tips visible -->
  <circle cx="185" cy="365" r="2" fill="#4A4A4A"/>
  <circle cx="215" cy="365" r="2" fill="#4A4A4A"/>
  
  <!-- Hoodie texture/seam details -->
  <path d="M170,380 Q200,375 230,380" stroke="#6B7160" stroke-width="1" fill="none" opacity="0.5"/>
  
</svg>